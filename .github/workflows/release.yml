name: Release

# Publishes every publishable workspace package when a version tag is pushed.
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret. It needs a
# one-time setup per package, on the PACKAGE's own page (not account settings):
#   npmjs.com/package/<name> -> Settings -> Trusted Publisher -> GitHub Actions
#   repository: salahuddinuqaili/mcp-rubric, workflow: release.yml
# Do this for mcp-rubric, mcp-rubric-server, and mcp-rubric-shared, or the
# publish step fails to authenticate.
#
# The two tools split the work deliberately:
#   - pnpm packs, because it is what rewrites `workspace:*` dependency ranges
#     into real version numbers. npm would publish the literal `workspace:*`.
#   - npm publishes, because the OIDC token exchange lives in the npm CLI.
#     pnpm 9's publish supports neither OIDC nor --provenance.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing requires npm >= 11.5.1; the bundled npm may be older.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: Verify the tag matches the CLI version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/cli/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/cli version $pkg"
            exit 1
          fi

      - name: Pack tarballs with resolved workspace versions
        run: |
          mkdir -p release
          for pkg in shared server cli; do
            ( cd "packages/$pkg" && pnpm pack --pack-destination ../../release )
          done
          ls -la release

      - name: Assert no workspace ranges survived into the tarballs
        run: |
          for tgz in release/*.tgz; do
            if tar -xzOf "$tgz" package/package.json | grep -q '"workspace:'; then
              echo "$tgz still contains a workspace: range"
              exit 1
            fi
          done
          echo "all tarballs carry resolved versions"

      # Dependencies first, so the registry never briefly serves a package whose
      # dependencies are not yet resolvable.
      - name: Publish to npm
        run: |
          npm publish release/mcp-rubric-shared-*.tgz --access public
          npm publish release/mcp-rubric-server-*.tgz --access public
          npm publish release/mcp-rubric-[0-9]*.tgz --access public
